name: Database

# Tests every migration on a throwaway local database.
# Applying to the live database is done by Supabase's GitHub integration
# (Supabase dashboard: production branch = claude/keen-ride-3fn08i for now).
on:
  push:
    branches: [main, claude/keen-ride-3fn08i]
    paths: ['supabase/**', '.github/workflows/database.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/database.yml']
  workflow_dispatch:

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # config.toml is generated here until we commit our own.
      - run: test -f supabase/config.toml || supabase init
      - run: supabase db start
      - run: supabase test db

